name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk test display
        run: sudo apt-get install -y xvfb python3-tk

      - name: Install build and validation tools
        run: python -m pip install -e ".[test]" build twine

      - name: Run tests with virtual display
        run: xvfb-run -a python -m coverage run -m unittest discover -s tests

      - name: Enforce branch coverage
        run: python -m coverage report --fail-under=80

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Install wheel and smoke test command
        run: |
          python -m venv .package-check
          .package-check/bin/python -m pip install dist/*.whl
          .package-check/bin/devbroom --version
          mkdir -p .package-check/data/project/.git .package-check/data/project/node_modules
          printf '{}' > .package-check/data/project/node_modules/package.json
          .package-check/bin/devbroom --cli --path .package-check/data --dry-run --no-settings-ignores

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  wheel-smoke-windows:
    name: Verify built wheel on Windows
    needs: build
    runs-on: windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install wheel and smoke test command
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel) { throw "No wheel was downloaded." }
          python -m venv .package-check
          .\.package-check\Scripts\python.exe -m pip install $wheel.FullName
          .\.package-check\Scripts\devbroom.exe --version
          $dataRoot = Join-Path (Get-Location) ".package-check\data"
          $project = Join-Path $dataRoot "project"
          New-Item -ItemType Directory -Force -Path (Join-Path $project ".git") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $project "node_modules") | Out-Null
          Set-Content -Path (Join-Path $project "node_modules\package.json") -Value "{}"
          $output = & .\.package-check\Scripts\devbroom.exe --cli --path $dataRoot --dry-run --no-settings-ignores 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Installed wheel smoke test failed: $output" }
          $text = $output -join "`n"
          if ($text -notmatch "node_modules" -or $text -notmatch "DRY RUN") {
            throw "Installed wheel did not report the disposable node_modules fixture: $text"
          }

  publish:
    name: Publish to PyPI
    needs: [build, wheel-smoke-windows]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
