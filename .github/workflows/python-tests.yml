name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tk test display on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb python3-tk

      - name: Install project test tools
        run: python -m pip install -e ".[test]"

      - name: Run tests with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m coverage run -m unittest discover -s tests

      - name: Run tests
        if: runner.os == 'Windows'
        run: python -m coverage run -m unittest discover -s tests

      - name: Enforce branch coverage
        run: python -m coverage report --fail-under=80

  required:
    name: required
    if: always()
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Require every platform and Python version
        run: test "${{ needs.test.result }}" = "success"
